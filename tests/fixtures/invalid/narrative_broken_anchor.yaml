version: "0.0.10"
name: "Broken Anchor"
narrative:
  summary: |
    References to [a missing decision](#decisions.nonexistent)
    and [a missing finding](#findings.also_missing) should fail.

inputs:
  - id: primary_data
    type: data
    source: "test.csv"

outputs:
  - id: accuracy
    type: metric
    description: "Accuracy"
    recipe:
      command: python src/main.py

decisions:
  method:
    label: "Method"
    rationale: "Which algorithm"
    default: a
    options:
      a:
        label: "A"
      b:
        label: "B"
