version: "1.0"
name: "Full Analysis"
narrative:
  summary: "A comprehensive test analysis with all features"
  methods: "Driven by preprocessing, model, test_split, and seed decisions."
  inputs: "Uses primary_data and an optional reference_study."
  outputs: "Emits a trained model, accuracy/f1 metrics, a plot, a summary table, and a conclusion."
authors:
  - "Test Author"
tags:
  - test
  - example
inputs:
  - id: primary_data
    type: data
    source: "test.csv"
    description: "Primary test data"
  - id: reference_study
    type: analysis
    ref: "analyses/reference"
    ref_version: "v1.0"
    description: "Reference study for evidence"
outputs:
  - id: trained_output
    type: data
    description: "Trained model artifact"
    recipe:
      command: python src/preprocess.py

  - id: accuracy
    type: metric
    description: "Model accuracy"
    inputs: [trained_output]
    recipe:
      command: python src/evaluate.py {inputs.trained_output}

  - id: f1_score
    type: metric
    description: "F1 score"
    inputs: [trained_output]
    recipe:
      command: python src/evaluate.py {inputs.trained_output}

  - id: plot
    type: figure
    description: "Results plot"
    inputs: [trained_output]
    recipe:
      command: python src/evaluate.py {inputs.trained_output}

  - id: summary
    type: table
    description: "Results summary"
    inputs: [trained_output]
    recipe:
      command: python src/evaluate.py {inputs.trained_output}

  - id: conclusion
    type: report
    description: "Analysis conclusion"
    inputs: [trained_output]
    recipe:
      command: python src/evaluate.py {inputs.trained_output}

decisions:
  preprocessing:
    label: "Preprocessing Method"
    rationale: "Choice of preprocessing affects model performance"
    default: standard
    options:
      none:
        label: "No Preprocessing"
        description: "Use raw data"
      standard:
        label: "Standardization"
        description: "Z-score normalization"
      minmax:
        label: "Min-Max Scaling"
        description: "Scale to [0, 1]"
        incompatible_with:
          - model.svm

  model:
    label: "Model Type"
    rationale: "Core algorithmic choice"
    default: rf
    options:
      svm:
        label: "SVM"
        description: "Support Vector Machine"
        requires:
          - preprocessing.standard
      rf:
        label: "Random Forest"
        description: "Ensemble of decision trees"
      lr:
        label: "Logistic Regression"
        description: "Linear classifier"

  test_split:
    label: "Test Split"
    rationale: "Trade-off between training data and evaluation"
    default: split_20
    options:
      split_20:
        label: "20%"
      split_30:
        label: "30%"

  seed:
    label: "Random Seed"
    rationale: "For reproducibility"
    default: seed_42
    options:
      seed_42:
        label: "42"
      seed_123:
        label: "123"
