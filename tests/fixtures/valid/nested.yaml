version: "0.0.11"
name: "SBI Cosmological Parameter Estimation"

inputs:
  - id: survey_catalog
    type: data
    source: "sn_survey_union2.1"
    description: "Observed Type Ia supernova catalog"

outputs:
  - id: posterior_contours
    type: figure
  - id: parameter_constraints
    type: table

decisions:
  cosmology_model:
    label: "Cosmological Model"
    default: flat_lcdm
    options:
      flat_lcdm:
        label: "Flat LCDM"
      wcdm:
        label: "wCDM"

analyses:
  build_mocks:
    inputs:
      - id: survey_data
        from: ../survey_catalog
    outputs:
      - id: mock_catalog
        type: data
        inputs: [survey_data]
        recipe:
          command: python src/generate_mocks.py {inputs.survey_data}
      - id: mock_sample_plot
        type: figure
        description: "Sample mock catalog visualization"
        inputs: [mock_catalog]
        recipe:
          command: python src/generate_mocks.py {inputs.mock_catalog}
    decisions:
      cosmology_model:
        from: ../cosmology_model
      noise_model:
        label: "Noise Model"
        default: heteroscedastic
        options:
          homoscedastic:
            label: "Homoscedastic"
            incompatible_with: ["cosmology_model.wcdm"]
          heteroscedastic:
            label: "Heteroscedastic"

  train_network:
    inputs:
      - id: training_data
        from: ../build_mocks.mock_catalog
    outputs:
      - id: trained_model
        type: data
        inputs: [training_data]
        recipe:
          command: python src/train.py {inputs.training_data}
          resources:
            gpus: 1
            memory: "32GB"
    decisions:
      architecture:
        label: "Network Architecture"
        default: maf
        options:
          maf:
            label: "Masked Autoregressive Flow"
          npe:
            label: "Neural Posterior Estimation"

  validate:
    description: "Validate trained model against observed data."
    inputs:
      - id: model
        from: ../train_network.trained_model
    outputs:
      - id: validation_report
        type: report
