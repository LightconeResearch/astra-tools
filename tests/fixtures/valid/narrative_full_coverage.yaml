version: "1.0"
name: "Narrative Full Coverage"
narrative: |
  Exercises the narrative anchor grammar with full coverage of
  the local elements: the [method decision](#decisions.method)
  with [option a](#decisions.method.options.a), the
  [accuracy output](#outputs.accuracy), the
  [best method finding](#findings.best_method), and the
  [preprocessing sub-analysis](#analyses.preprocessing). A
  descendant reference like [child scaling](#preprocessing.decisions.scaling)
  also counts toward the sub-analysis's coverage.

inputs:
  - id: primary_data
    type: data
    source: "test.csv"

outputs:
  - id: accuracy
    type: metric
    description: "Accuracy"
    recipe:
      command: python src/main.py

decisions:
  method:
    label: "Method"
    rationale: "Which algorithm"
    default: a
    options:
      a:
        label: "A"
      b:
        label: "B"

findings:
  best_method:
    id: best_method
    claim: "Method A is best."
    created_at: "2026-01-01T00:00:00"
    evidence: []

analyses:
  preprocessing:
    narrative: |
      Sub-analysis narrative mentions its own
      [scaling decision](#decisions.scaling) and its
      [scaled output](#outputs.scaled).
    inputs:
      - id: raw
        type: data
        from: primary_data
    outputs:
      - id: scaled
        type: data
        description: "Scaled data"
        recipe:
          command: python src/scale.py
    decisions:
      scaling:
        label: "Scaling"
        rationale: "Which scaler"
        default: standard
        options:
          standard:
            label: "Standard"
          minmax:
            label: "MinMax"
