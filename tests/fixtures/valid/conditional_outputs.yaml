# Analysis with conditional outputs using when conditions
version: "0.0.11"
name: "Conditional Outputs Analysis"
description: "Tests when conditions on outputs with negation and lists"
inputs:
  - id: training_data
    type: data
    source: "data/train.csv"
outputs:
  - id: trained_model
    type: data
    inputs: [training_data]
    recipe:
      command: python scripts/train.py {inputs.training_data}

  # Only produced when training_sample is not bright_only
  - id: faint_metrics
    type: metric
    when: "~training_sample.bright_only"
    inputs: [trained_model]
    recipe:
      command: python scripts/evaluate.py {inputs.trained_model}

  # Only produced when model is svm
  - id: svm_report
    type: report
    when: model.svm
    inputs: [trained_model]
    recipe:
      command: python scripts/svm_report.py {inputs.trained_model}

  # Only produced when multiple conditions met (AND)
  - id: combined_report
    type: report
    when:
      - "~training_sample.bright_only"
      - model.svm
    inputs: [trained_model]
    recipe:
      command: python scripts/combined.py {inputs.trained_model}

decisions:
  training_sample:
    label: "Training Sample"
    default: combined
    options:
      combined:
        label: "Combined"
      bright_only:
        label: "Bright Only"

  model:
    label: "Model Type"
    default: rf
    options:
      svm:
        label: "SVM"
      rf:
        label: "Random Forest"
