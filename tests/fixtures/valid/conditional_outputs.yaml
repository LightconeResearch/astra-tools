# Analysis with conditional outputs using when conditions
version: "1.0"
name: "Conditional Outputs Analysis"
description: "Tests when conditions on outputs with negation and lists"
inputs:
  - id: training_data
    type: data
    source: "data/train.csv"
outputs:
  - id: trained_model
    type: data
    recipe:
      command: python scripts/train.py

  - id: faint_metrics
    type: metric
    recipe:
      command: python scripts/evaluate.py
      inputs: [trained_model]

  - id: svm_report
    type: report
    recipe:
      command: python scripts/svm_report.py
      inputs: [trained_model]

  - id: combined_report
    type: report
    recipe:
      command: python scripts/combined.py
      inputs: [trained_model]

decisions:
  training_sample:
    label: "Training Sample"
    default: combined
    options:
      combined:
        label: "Combined"
      bright_only:
        label: "Bright Only"

  model:
    label: "Model Type"
    default: rf
    options:
      svm:
        label: "SVM"
      rf:
        label: "Random Forest"
