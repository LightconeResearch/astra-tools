[project]
name = "astra-tools"
dynamic = ["version"]
description = "Python CLI and SDK for working with ASTRA (Agentic Schema for Transparent Research Analysis) specifications: validation, paper management, and evidence verification."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "Francois Lanusse", email = "francois.lanusse@cnrs.fr" },
    { name = "Liam Parker", email = "lhparker@berkeley.edu" },
    { name = "Cail Daley", email = "cail.daley@cea.fr" },
]
keywords = [
    "astra",
    "research",
    "reproducibility",
    "multiverse-analysis",
    "scientific-computing",
    "schema",
    "validation",
    "linkml",
    "agentic",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

dependencies = [
    "astra-spec>=0.0.7",
    "click>=8.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "pypdf>=4.0",
    "httpx>=0.27",
    "rapidfuzz>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff",
    "mypy",
    "types-PyYAML",
]

[project.scripts]
astra = "astra.cli:main"

[project.urls]
Homepage = "https://astra-spec.org/"
Repository = "https://github.com/LightconeResearch/astra-tools"
Issues = "https://github.com/LightconeResearch/astra-tools/issues"
Specification = "https://github.com/LightconeResearch/astra-spec"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/astra"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/astra",
    "/pyproject.toml",
    "/LICENSE",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "astra.datamodel",
    "astra.datamodel.*",
]
follow_untyped_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: marks tests as requiring network access",
    "slow: marks tests as slow running",
]
