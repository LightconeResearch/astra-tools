[project]
name = "astra-tools"
dynamic = ["version"]
description = "Validator, checker and a runner's building blocks for ASTRA v0.1 analyses."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "Francois Lanusse", email = "francois.lanusse@cnrs.fr" },
    { name = "Liam Parker", email = "lhparker@berkeley.edu" },
    { name = "Cail Daley", email = "cail.daley@cea.fr" },
]
keywords = [
    "astra",
    "research",
    "reproducibility",
    "multiverse-analysis",
    "scientific-computing",
    "schema",
    "validation",
    "linkml",
    "agentic",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

dependencies = [
    "astra-spec >= 0.1.0rc1, < 0.2",
    "click >= 8.2.1",
    "jsonschema >= 4.23",
    "rich >= 13.8",
    "ruamel.yaml >= 0.19.1",
]

[project.optional-dependencies]
reference = ["linkml-runtime >= 1.12"]
evidence = ["pypdf >= 5", "rapidfuzz >= 3"]

[project.scripts]
astra = "astra.cli:main"
# Alias matching the package name, so `uvx astra-tools@<version> <command>`
# works without `--from astra-tools astra`.
astra-tools = "astra.cli:main"

[project.urls]
Homepage = "https://astra-spec.org/"
Repository = "https://github.com/LightconeResearch/astra-tools"
Issues = "https://github.com/LightconeResearch/astra-tools/issues"
Specification = "https://github.com/LightconeResearch/astra-spec"

[dependency-groups]
dev = [
    "pytest >= 8.3",
    "pytest-cov >= 6",
    "ruff >= 0.9",
    "mypy >= 1.15",
    "types-jsonschema >= 4.23",
    "astra-tools[reference,evidence]",  # the import-cost tests' "no extra" checks need them there
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/astra"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/astra",
    "/pyproject.toml",
    "/LICENSE",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["linkml_runtime", "linkml_runtime.*"]  # ships no py.typed
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
