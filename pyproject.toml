[project]
name = "asp"
dynamic = ["version"]
description = "Agentic Science Protocol - A declarative specification format for scientific analyses"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [
    { name = "EiffL" }
]
keywords = ["science", "analysis", "specification", "workflow", "reproducibility"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
    "jsonschema>=4.0",
    "pydantic>=2.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff",
    "mypy",
    "types-PyYAML",
    "types-jsonschema",
]
workflow = [
    "snakemake>=8.0",
    "graphviz",  # Python bindings; also requires system graphviz (brew install graphviz / apt install graphviz)
]

[project.scripts]
asp = "asp.cli:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/asp"]

# Automatically bundle spec/draft/ into the package as asp/spec/
[tool.hatch.build.targets.wheel.force-include]
"spec/draft" = "asp/spec"

[tool.hatch.build.targets.sdist]
include = ["src/asp", "spec/draft"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
