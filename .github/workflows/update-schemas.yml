name: Update Schemas

on:
  push:
    tags:
      - "v*"

jobs:
  update-schemas:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main  # Check out main branch to commit updates

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          # Install from the tag to get correct version
          pip install "git+https://github.com/${{ github.repository }}.git@${{ github.ref_name }}"

      - name: Regenerate schemas
        run: asp schema export -o schemas/

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet schemas/; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add schemas/
          git commit -m "Update schemas for ${{ github.ref_name }}"
          git push origin main
