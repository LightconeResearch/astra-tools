---
name: Publish Python Package

# Publishes with trusted publishing to PyPI on releases created in GitHub UI.
# For draft status, nothing happens.

on:  # yamllint disable-line rule:truthy
  release:
    types: [published]

permissions: {}

jobs:
  build:
    name: Build Python distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed for hatch-vcs versioning
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Build source and wheel archives
        run: uv build

      - name: Store built distribution
        uses: actions/upload-artifact@v4
        with:
          name: distribution-files
          path: dist/

  # Tests the built wheel as users install it: pip takes astra-spec from PyPI, the newest release
  # the wheel's requirement accepts. The tests read that release's conformance suite, examples and
  # test documents from astra-spec's source tree, checked out at the release's tag.
  test:
    name: Test built package
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out astra-tools
        uses: actions/checkout@v4
        with:
          path: astra-tools
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: distribution-files
          path: dist/

      - name: Install the wheel with its extras, and pytest
        run: |
          wheels=(dist/*.whl)
          if [[ ${#wheels[@]} -ne 1 ]]; then
            echo "::error::dist/ holds ${#wheels[@]} wheels, not one"
            exit 1
          fi
          python -m pip install --upgrade pip
          python -m pip install "${wheels[0]}[reference,evidence]" "pytest >= 8.3"

      - name: Read the version of astra-spec installed
        id: spec
        run: |
          version="$(python -c 'import importlib.metadata as m; print(m.version("astra-spec"))')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check out astra-spec at that release's tag
        uses: actions/checkout@v4
        with:
          repository: astra-project/astra-spec
          ref: v${{ steps.spec.outputs.version }}
          path: astra-spec
          persist-credentials: false

      - name: Run tests
        working-directory: astra-tools
        env:
          ASTRA_SPEC_SOURCE: ${{ github.workspace }}/astra-spec
        run: pytest -q -p no:cacheprovider

  pypi-publish:
    name: Publish to PyPI
    needs: [build, test]
    runs-on: ubuntu-latest
    environment:
      name: pypi-release
      url: https://pypi.org/p/astra-tools
    permissions:
      id-token: write  # mandatory for trusted publishing
    steps:
      - name: Download built distribution
        uses: actions/download-artifact@v4
        with:
          name: distribution-files
          path: dist

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          verbose: true
