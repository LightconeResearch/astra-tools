---
name: Publish Python Package

# Publishes with trusted publishing to PyPI on releases created in GitHub UI.
# For draft status, nothing happens.

on:  # yamllint disable-line rule:truthy
  release:
    types: [published]

permissions: {}

jobs:
  build:
    name: Build Python distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed for hatch-vcs versioning
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Build source and wheel archives
        run: uv build

      - name: Store built distribution
        uses: actions/upload-artifact@v4
        with:
          name: distribution-files
          path: dist/

  # Tests the built wheel against astra-spec at the commit in astra-spec.pin, installed editable
  # from its source tree: the tests read its fixtures and examples there. That commit must be the
  # commit of an astra-spec tag, so that the editable install reports that tag's version, and the
  # wheel's requirement on astra-spec must accept it.
  test:
    name: Test built package
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out astra-tools
        uses: actions/checkout@v4
        with:
          path: astra-tools
          persist-credentials: false

      - name: Read the astra-spec pin
        id: pin
        run: |
          commit="$(tr -d '[:space:]' < astra-tools/astra-spec.pin)"
          if [[ ! "$commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error file=astra-spec.pin::astra-spec.pin must hold one full 40-character commit id"
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Check out astra-spec at the pin
        uses: actions/checkout@v4
        with:
          repository: LightconeResearch/astra-spec
          ref: ${{ steps.pin.outputs.commit }}
          path: astra-spec-pinned
          fetch-depth: 0  # its version comes from its tags
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: distribution-files
          path: dist/

      - name: Install astra-spec at the pin, pytest and packaging
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./astra-spec-pinned "pytest >= 8.3" packaging

      # pip doesn't refuse a wheel whose requirement the editable install misses: it replaces
      # the editable install with astra-spec from PyPI, and the tests lose its source tree.
      - name: Check the pin against the wheel's astra-spec requirement
        id: wheel
        shell: python
        run: |
          import email
          import glob
          import importlib.metadata
          import os
          import sys
          import zipfile

          from packaging.requirements import Requirement
          from packaging.utils import canonicalize_name
          from packaging.version import Version


          def fail(message):
              print(f"::error::{message}")
              sys.exit(1)


          wheels = glob.glob("dist/*.whl")
          if len(wheels) != 1:
              fail(f"dist/ holds {len(wheels)} wheels, not one")
          wheel = wheels[0]
          with zipfile.ZipFile(wheel) as archive:
              names = [n for n in archive.namelist() if n.endswith(".dist-info/METADATA")]
              metadata = email.message_from_bytes(archive.read(names[0]))
          required = [
              requirement
              for requirement in map(Requirement, metadata.get_all("Requires-Dist", []))
              if canonicalize_name(requirement.name) == "astra-spec"
          ]
          if len(required) != 1:
              fail(f"{wheel} has {len(required)} requirements on astra-spec, not one")
          required = required[0]
          version = Version(importlib.metadata.version("astra-spec"))
          print(f"{wheel} requires {required}; astra-spec.pin gives astra-spec {version}")
          if version.is_devrelease or version.local is not None:
              fail(
                  f"astra-spec.pin's commit gives astra-spec {version}, which is no release: "
                  f"the pin must be the commit of an astra-spec tag that {required} accepts"
              )
          if not required.specifier.contains(version, prereleases=True):
              fail(
                  f"the wheel requires {required}, but astra-spec.pin's commit gives "
                  f"astra-spec {version}: the pin must be the commit of a tag that it accepts"
              )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"wheel={wheel}\n")

      - name: Install the wheel with its extras
        env:
          WHEEL: ${{ steps.wheel.outputs.wheel }}
        run: python -m pip install "${WHEEL}[reference,evidence]"

      - name: Run tests
        working-directory: astra-tools
        run: pytest -q -p no:cacheprovider

  pypi-publish:
    name: Publish to PyPI
    needs: [build, test]
    runs-on: ubuntu-latest
    environment:
      name: pypi-release
      url: https://pypi.org/p/astra-tools
    permissions:
      id-token: write  # mandatory for trusted publishing
    steps:
      - name: Download built distribution
        uses: actions/download-artifact@v4
        with:
          name: distribution-files
          path: dist

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          verbose: true
