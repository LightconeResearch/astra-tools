name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run ruff check
        run: ruff check src/ tests/

      - name: Run ruff format check
        run: ruff format --check src/ tests/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run mypy
        run: mypy src/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed for hatch-vcs versioning

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests with coverage
        run: pytest tests/ -v --cov=astra --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false

  schema-freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pydantic pyyaml

      - name: Verify schemas are up to date
        run: |
          python tools/generate_schemas.py --output-dir /tmp/schemas
          if ! diff -r spec/draft/ /tmp/schemas/; then
            echo ""
            echo "ERROR: Schemas in spec/draft/ are stale."
            echo "Run 'python tools/generate_schemas.py' and commit the results."
            exit 1
          fi
          echo "Schemas are up to date."

  validate-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Validate example files
        run: |
          astra validate examples/iris/astra.yaml
          astra validate examples/iris/universes/baseline.yaml -a examples/iris/astra.yaml

  spec-immutability:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check released specs are not modified
        run: |
          # Find all versioned spec directories (spec/X.Y/, not spec/draft/)
          changed_specs=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- 'spec/' | grep -E '^spec/[0-9]+\.[0-9]+/' || true)
          if [ -n "$changed_specs" ]; then
            echo "ERROR: Released spec versions are immutable. The following files were modified:"
            echo "$changed_specs"
            echo ""
            echo "Released specs in spec/X.Y/ directories must never be changed."
            exit 1
          fi
          echo "No released specs modified."
