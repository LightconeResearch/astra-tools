name: CI

# The tests read astra-spec's fixtures and examples from its source tree, so astra-spec is checked
# out at the commit in astra-spec.pin, beside astra-tools, where [tool.uv.sources] expects it
# (../astra-spec-pinned).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    defaults:
      run:
        working-directory: astra-tools
    steps:
      - name: Check out astra-tools
        uses: actions/checkout@v4
        with:
          path: astra-tools
          fetch-depth: 0  # hatch-vcs reads the version from the tags
          persist-credentials: false

      - name: Read the astra-spec pin
        id: pin
        run: |
          commit="$(tr -d '[:space:]' < astra-spec.pin)"
          if [[ ! "$commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error file=astra-spec.pin::astra-spec.pin must hold one full 40-character commit id"
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Check out astra-spec at the pin
        uses: actions/checkout@v4
        with:
          repository: LightconeResearch/astra-spec
          ref: ${{ steps.pin.outputs.commit }}
          path: astra-spec-pinned
          fetch-depth: 0  # its version comes from its tags
          persist-credentials: false

      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v8.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install astra-tools with the dev group, which brings both extras
        run: uv sync --frozen

      - name: Run tests
        run: uv run --frozen pytest -q -p no:cacheprovider

      - name: Run mypy
        run: uv run --frozen mypy --strict src/

      - name: Run ruff check
        run: uv run --frozen ruff check src/ tests/

      - name: Run ruff format check
        run: uv run --frozen ruff format --check src/ tests/
