name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    defaults:
      run:
        working-directory: astra-tools
    steps:
      - name: Check out astra-tools
        uses: actions/checkout@v4
        with:
          path: astra-tools
          fetch-depth: 0  # hatch-vcs reads the version from the tags
          persist-credentials: false

      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v8.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install astra-tools with the dev group, which brings both extras
        run: uv sync --frozen

      - name: Run tests
        run: uv run --frozen pytest -q -p no:cacheprovider

      - name: Run mypy
        run: uv run --frozen mypy --strict src/

      - name: Run ruff check
        run: uv run --frozen ruff check src/ tests/

      - name: Run ruff format check
        run: uv run --frozen ruff format --check src/ tests/
