name: CI

# astra-spec is the release uv.lock installs from PyPI. The tests read that release's conformance
# suite, examples and test documents from astra-spec's source tree, so astra-spec is checked out at
# the release's tag, which ASTRA_SPEC_SOURCE names.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    defaults:
      run:
        working-directory: astra-tools
    steps:
      - name: Check out astra-tools
        uses: actions/checkout@v4
        with:
          path: astra-tools
          fetch-depth: 0  # hatch-vcs reads the version from the tags
          persist-credentials: false

      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v8.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install astra-tools with the dev group, which brings both extras
        run: uv sync --frozen

      - name: Read the version of astra-spec installed
        id: spec
        run: |
          version="$(uv run --frozen python -c 'import importlib.metadata as m; print(m.version("astra-spec"))')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check out astra-spec at that release's tag
        uses: actions/checkout@v4
        with:
          repository: LightconeResearch/astra-spec
          ref: v${{ steps.spec.outputs.version }}
          path: astra-spec
          persist-credentials: false

      - name: Run tests
        env:
          ASTRA_SPEC_SOURCE: ${{ github.workspace }}/astra-spec
        run: uv run --frozen pytest -q -p no:cacheprovider

      - name: Run mypy
        run: uv run --frozen mypy --strict src/

      - name: Run ruff check
        run: uv run --frozen ruff check src/ tests/

      - name: Run ruff format check
        run: uv run --frozen ruff format --check src/ tests/
