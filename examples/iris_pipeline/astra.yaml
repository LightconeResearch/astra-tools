name: iris_pipeline
astra_version: "1.0"
label: Iris Two-Stage Classification
description: >
  A two-stage pipeline for Iris classification that demonstrates
  sub-analyses. A feature-extraction stage learns a compact
  representation, whose output feeds into a classification stage.
authors:
  - ASTRA Examples
tags:
  - classification
  - sub-analyses
  - sklearn
  - example

inputs:
  - name: iris_data
    type: data
    source: sklearn.datasets.load_iris
    description: "Fisher's classic 150-sample, 4-feature, 3-class dataset"

outputs:
  - name: accuracy
    type: metric
    description: Classification accuracy on held-out test set
    output_from: classification.accuracy
  - name: feature_plot
    type: figure
    description: Scatter plot of extracted features colored by class
    output_from: feature_extraction.feature_plot
  - name: pipeline_summary
    type: report
    description: End-to-end comparison of feature extraction methods
    recipe:
      command: python src/summarize.py

decisions:
  test_split:
    name: test_split
    label: Test Set Proportion
    description: Trade-off between training data and evaluation reliability
    default: twenty_pct
    options:
      twenty_pct:
        name: twenty_pct
        label: "20%"
        description: 80/20 train-test split
      thirty_pct:
        name: thirty_pct
        label: "30%"
        description: 70/30 train-test split
  random_seed:
    name: random_seed
    label: Random Seed
    description: Controls reproducibility of splits and model initialization
    default: seed_42
    options:
      seed_42:
        name: seed_42
        label: "42"
      seed_7:
        name: seed_7
        label: "7"

analyses:
  feature_extraction:
    name: feature_extraction
    astra_version: "1.0"
    label: Feature Extraction
    description: >
      Learn a low-dimensional representation of the 4 Iris features.
      PCA provides a linear, deterministic baseline; the MLP encoder
      trains a small autoencoder and keeps the bottleneck layer.
    inputs:
      - name: raw_features
        type: data
        input_from: iris_data
        description: Raw 4-dimensional Iris features from parent
    outputs:
      - name: features
        type: data
        description: Transformed feature matrix (n_samples x n_components)
        recipe:
          command: python src/extract_features.py
      - name: feature_plot
        type: figure
        description: Scatter plot of extracted features
        recipe:
          command: python src/plot_features.py
          depends_on: [features]
    decisions:
      seed:
        name: seed
        delegates_to: ../random_seed
      method:
        name: method
        label: Extraction Method
        description: PCA is interpretable; MLP encoder may capture nonlinear structure
        default: pca
        options:
          pca:
            name: pca
            label: PCA
            description: Principal Component Analysis
          mlp_encoder:
            name: mlp_encoder
            label: MLP Encoder
            description: Bottleneck layer of a small autoencoder (4-8-k-8-4)
            incompatible_with:
              - n_components.three
      n_components:
        name: n_components
        label: Number of Components
        description: Dimensionality of the learned representation
        default: two
        options:
          two:
            name: two
            label: 2 components
            description: Aggressive reduction, easy to visualize
          three:
            name: three
            label: 3 components
            description: Retains more variance

  classification:
    name: classification
    astra_version: "1.0"
    label: Classification
    description: >
      Train a classifier on the extracted features and evaluate
      accuracy on the held-out test set.
    inputs:
      - name: features
        type: data
        input_from: feature_extraction.features
        description: Transformed features from the extraction stage
    outputs:
      - name: predictions
        type: data
        description: Predicted class labels for the test set
        recipe:
          command: python src/classify.py
      - name: accuracy
        type: metric
        description: Classification accuracy on held-out test set
        recipe:
          command: python src/evaluate.py
          depends_on: [predictions]
    decisions:
      split:
        name: split
        delegates_to: ../test_split
      classifier:
        name: classifier
        label: Classifier
        description: Logistic regression is a strong baseline; SVM adds nonlinear kernel
        default: logistic
        options:
          logistic:
            name: logistic
            label: Logistic Regression
            description: Multinomial logistic regression with L2 penalty
          svm:
            name: svm
            label: SVM (RBF)
            description: Support vector machine with radial basis function kernel
          knn:
            name: knn
            label: k-Nearest Neighbors
            description: k=5 nearest neighbors in the extracted feature space

universes:
  baseline:
    name: baseline
    description: PCA with 2 components, logistic regression — the simplest sensible pipeline
    selections:
      - decision: test_split
        option: twenty_pct
      - decision: random_seed
        option: seed_42
      - decision: feature_extraction/method
        option: pca
      - decision: feature_extraction/n_components
        option: two
      - decision: classification/classifier
        option: logistic
  mlp_svm:
    name: mlp_svm
    description: MLP encoder features with SVM classifier
    selections:
      - decision: test_split
        option: twenty_pct
      - decision: random_seed
        option: seed_42
      - decision: feature_extraction/method
        option: mlp_encoder
      - decision: feature_extraction/n_components
        option: two
      - decision: classification/classifier
        option: svm
