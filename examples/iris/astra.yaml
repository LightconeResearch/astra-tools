name: iris_classification
astra_version: "1.0"
label: Iris Classification Study
description: >
  A demonstration analysis that builds a classifier for the classic
  Iris dataset, exploring different preprocessing and model choices.
authors:
  - ASTRA Examples
tags:
  - classification
  - sklearn
  - example

inputs:
  - name: iris_data
    type: data
    source: sklearn.datasets.load_iris
    description: "Fisher's classic 150-sample, 3-class dataset"
  - name: preprocessing_study
    type: analysis
    based_on: analyses/scaling_comparison_2024
    description: Our previous study on scaling methods

outputs:
  - name: trained_output
    type: data
    description: Best performing classifier
    recipe:
      command: python src/train.py
  - name: accuracy
    type: metric
    description: Classification accuracy on held-out test set
    recipe:
      command: python src/evaluate.py
      depends_on: [trained_output]
  - name: f1_score
    type: metric
    description: Macro-averaged F1 score
    recipe:
      command: python src/evaluate.py
      depends_on: [trained_output]
  - name: confusion_matrix
    type: figure
    description: Confusion matrix heatmap
    recipe:
      command: python src/evaluate.py
      depends_on: [trained_output]
  - name: model_comparison
    type: table
    description: Accuracy by model and preprocessing combination
    recipe:
      command: python src/evaluate.py
      depends_on: [trained_output]
  - name: conclusion
    type: report
    description: Summary of classifier performance and suitability
    recipe:
      command: python src/evaluate.py
      depends_on: [trained_output]

decisions:
  scaling:
    name: scaling
    label: Feature Scaling
    description: Scaling affects distance-based algorithms like SVM
    default: standard
    options:
      none:
        name: none
        label: No Scaling
        description: Use raw feature values
      standard:
        name: standard
        label: StandardScaler
        description: Z-score normalization (mean=0, std=1)
      minmax:
        name: minmax
        label: MinMaxScaler
        description: Scale to [0, 1] range
        incompatible_with:
          - model.svm
  model:
    name: model
    label: Classification Model
    description: Core algorithmic choice affecting accuracy and interpretability
    default: random_forest
    options:
      svm:
        name: svm
        label: Support Vector Machine
        description: Maximum margin classifier
        requires:
          - scaling.standard
      random_forest:
        name: random_forest
        label: Random Forest
        description: Ensemble of decision trees
      logistic:
        name: logistic
        label: Logistic Regression
        description: Linear classifier with probabilistic output
  test_size:
    name: test_size
    label: Test Set Proportion
    description: Trade-off between training data and evaluation reliability
    default: small
    options:
      small:
        name: small
        label: "20%"
      medium:
        name: medium
        label: "30%"
  random_seed:
    name: random_seed
    label: Random Seed
    description: For reproducibility and stability testing
    default: seed_42
    options:
      seed_42:
        name: seed_42
        label: "42"
      seed_123:
        name: seed_123
        label: "123"

universes:
  baseline:
    name: baseline
    description: Default configuration using standard practices
    selections:
      - decision: scaling
        option: standard
      - decision: model
        option: random_forest
      - decision: test_size
        option: small
      - decision: random_seed
        option: seed_42
  svm_focused:
    name: svm_focused
    description: Configuration optimized for SVM (requires standard scaling)
    selections:
      - decision: scaling
        option: standard
      - decision: model
        option: svm
      - decision: test_size
        option: small
      - decision: random_seed
        option: seed_42
